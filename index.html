<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Tamil Speech App</title>

    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }

        button {
            padding: 10px 15px;
            margin: 10px;
            cursor: pointer;
        }

        .recording {
            background-color: red;
            color: white;
        }

        #progressBar {
            width: 0%;
            height: 20px;
            background-color: green;
            transition: 0.3s;
        }

        .box {
            margin: 10px 0;
        }
    </style>
</head>

<body>

    <h2>🎤 Tamil Speech Practice</h2>

    <h3>Expected Word: <span id="expectedWord"></span></h3>

    <button id="recordBtn">🎤 Speak</button>
    <div id="result" class="box"></div>

    <h3>Scores</h3>
    <div id="score"></div>
    <div id="accentScore"></div>
    <div id="fluencyScore"></div>

    <div id="feedback" class="box"></div>

    <h3>Progress</h3>
    <div id="attempts"></div>
    <div id="correct"></div>
    <div id="accuracy"></div>
    <div id="level"></div>

    <div id="progressBar"></div>

    <hr>

    <h2>📖 Thirukkural Practice</h2>

    <button id="kuralBtn">🔊 Read Thirukkural</button>
    <div id="kuralResult" class="box"></div>

    <!-- 🔥 IMPORTANT: JS FILE LINK -->
    <script src="script.js"></script>

</body>

</html>
