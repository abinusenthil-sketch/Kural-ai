<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Tamil Speech App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="hero">
        <h1>🎤 Tamil Speech Trainer</h1>
        <h2>Practice & Improve Pronunciation</h2>
        <div class="version-badge">Practice Session 3</div>
    </div>

    <!-- WORD PRACTICE -->
    <div class="card">
        <h3>Speak This Word</h3>
        <div class="expected">
            <span id="expectedWord"></span>
        </div>

        <button id="recordBtn">🎤 Speak</button>

        <div id="result"></div>

        <div id="feedback"></div>
    </div>

    <!-- SCORES -->
    <div class="card">
        <h3>AI Score</h3>

        <div class="score-grid">
            <div class="score-card">
                <h4>Pronunciation</h4>
                <p id="score">0%</p>
            </div>

            <div class="score-card">
                <h4>Accent</h4>
                <p id="accentScore">0%</p>
            </div>

            <div class="score-card">
                <h4>Fluency</h4>
                <p id="fluencyScore">0%</p>
            </div>
        </div>

        <div id="attempts"></div>
        <div id="correct"></div>
        <div id="accuracy"></div>
        <div id="level"></div>

        <div class="progress-container">
            <div id="progressBar"></div>
        </div>
    </div>

    <!-- THIRUKKURAL -->
    <div class="card">
        <h3>Thirukkural Practice</h3>

        <button id="kuralBtn">📖 Read Thirukkural</button>

        <div id="kuralResult"></div>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
